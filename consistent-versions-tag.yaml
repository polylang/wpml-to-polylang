checks:
  release-tag:
    normalize:
      - trim-v-prefix
      - version
    expected:
      reader: env
      variable: GITHUB_REF_NAME
    values:
      plugin-constant:
        reader: php
        file: wpml-to-polylang.php
        path: $.constants.WPML_TO_POLYLANG_VERSION
      plugin-header:
        reader: wordpress-plugin
        file: wpml-to-polylang.php
        path: $.Version
      wordpress-readme:
        reader: wordpress-readme
        file: readme.txt
        path: $['Stable tag']
